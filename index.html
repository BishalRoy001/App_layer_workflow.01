<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Layer Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-body: #f4f5f7;
            --bg-surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --border-light: #e5e7eb;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --log-out: #f0fdf4;
            --log-in: #eff6ff;
            --log-border-out: #22c55e;
            --log-border-in: #3b82f6;
            --star-color: rgba(37, 99, 235, 0.4);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --log-out: rgba(34, 197, 94, 0.1);
            --log-in: rgba(59, 130, 246, 0.1);
            --log-border-out: #22c55e;
            --log-border-in: #3b82f6;
            --star-color: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            transition: all 0.3s ease;
        }

        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02);
            position: relative;
        }

        .theme-toggle {
            position: absolute; right: 2rem; top: 50%;
            transform: translateY(-50%); background: transparent;
            border: 1px solid var(--border-light); color: var(--text-primary);
            font-size: 1.25rem; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: 0.2s ease;
        }

        .theme-toggle:hover { background: var(--border-light); }
        h1 { margin: 0; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; }
        .subtitle { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--text-secondary); }

        .main-workspace {
            display: flex; gap: 2rem; padding: 2rem; flex: 1;
            max-width: 1400px; margin: 0 auto; width: 100%;
            box-sizing: border-box; height: calc(100vh - 100px);
        }

        .panel {
            background: var(--bg-surface); border: 1px solid var(--border-light);
            border-radius: 8px; padding: 2rem; display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }

        .left-panel { flex: 1 1 350px; max-width: 450px; height: fit-content; }
        .right-panel { flex: 2 1 500px; background: rgba(var(--bg-surface), 0.85); backdrop-filter: blur(4px); overflow: hidden; }

        h2 {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-secondary);
            border-bottom: 1px solid var(--border-light); padding-bottom: 0.75rem;
            margin-top: 0; margin-bottom: 1.5rem; flex-shrink: 0;
        }

        .activity-section { display: none; flex-direction: column; gap: 1rem; margin-top: 1.5rem;}
        .activity-section.active { display: flex; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
        .input-group { margin-bottom: 0.5rem; }

        select, input, textarea {
            width: 100%; padding: 0.625rem 0.75rem; border: 1px solid var(--border-light);
            border-radius: 6px; font-family: inherit; font-size: 0.875rem;
            box-sizing: border-box; background: var(--bg-body); color: var(--text-primary);
            transition: 0.2s ease;
        }

        select:focus, input:focus, textarea:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button.action-btn {
            background: var(--accent-primary); color: white; border: none;
            font-weight: 500; font-size: 0.875rem; padding: 0.75rem;
            border-radius: 6px; cursor: pointer; width: 100%;
            margin-top: 0.5rem; transition: 0.2s ease;
        }

        button.action-btn:hover { background: var(--accent-hover); }

        .controls-container { display: none; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; flex-shrink: 0; }
        
        .control-btn {
            background: var(--bg-body); color: var(--text-primary);
            border: 1px solid var(--border-light); font-size: 0.875rem;
            padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;
            transition: 0.2s ease; font-weight: 500;
        }
        
        .control-btn:hover:not(:disabled) { background: var(--border-light); }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #log-container { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; }
        
        .log-entry {
            padding: 1.25rem; margin-bottom: 1rem; border-radius: 6px;
            border: 1px solid var(--border-light); opacity: 1;
            transform: translateY(0); flex-shrink: 0;
        }
        
        .log-entry.animating { opacity: 0; transform: translateY(10px); animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .log-out { background: var(--log-out); border-left: 4px solid var(--log-border-out); }
        .log-in { background: var(--log-in); border-left: 4px solid var(--log-border-in); }
        
        .meta {
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 600; margin-bottom: 0.75rem; font-size: 0.75rem;
            color: var(--text-secondary); text-transform: uppercase;
        }
        
        .protocol-badge {
            background: var(--bg-body); padding: 0.25rem 0.5rem;
            border-radius: 4px; border: 1px solid var(--border-light); color: var(--text-primary);
        }
        
        pre { margin: 0; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; line-height: 1.6; }
        
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
        
        @media (max-width: 900px) {
            body { height: auto; }
            .main-workspace { flex-direction: column; height: auto; padding: 1rem; gap: 1.5rem; }
            .left-panel { max-width: 100%; flex: none; }
            .right-panel { flex: none; height: 500px; }
            header { padding: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="star-canvas"></canvas>
    
    <header>
        <h1>Application Layer Dashboard</h1>
        <p class="subtitle">Live Protocol Synchronization Monitor</p>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Toggle Mode">🌓</button>
    </header>
    
    <div class="main-workspace">
        <div class="panel left-panel">
            <h2>Command Center</h2>
            
            <div class="input-group">
                <label for="activity-selector">Select Operation</label>
                <select id="activity-selector" onchange="switchActivity()">
                    <option value="browse">HTTP Web Browsing</option>
                    <option value="mail">SMTP Mail Transfer</option>
                    <option value="stream">HTTP Adaptive Streaming</option>
                </select>
            </div>
            
            <div id="form-browse" class="activity-section active">
                <div class="input-group">
                    <label>Target URL</label>
                    <input type="text" id="url" value="http://www.youtube.com">
                </div>
                <button class="action-btn" onclick="triggerAction('browse')">Execute Request</button>
            </div>
            
            <div id="form-mail" class="activity-section">
                <div class="input-group">
                    <label>Recipient Address</label>
                    <input type="text" id="to_email" value="instructor@university.edu">
                </div>
                <div class="input-group">
                    <label>Subject Line</label>
                    <input type="text" id="subject" value="Protocol Assignment">
                </div>
                <div class="input-group">
                    <label>Message Payload</label>
                    <textarea id="body" rows="4">Please find my submission attached.</textarea>
                </div>
                <button class="action-btn" onclick="triggerAction('mail')">Transmit Data</button>
            </div>
            
            <div id="form-stream" class="activity-section">
                <div class="input-group">
                    <label>Stream Resolution</label>
                    <select id="quality">
                        <option value="1080p">1080p High Definition</option>
                        <option value="720p">720p Standard</option>
                    </select>
                </div>
                <button class="action-btn" onclick="triggerAction('stream')">Initialize Stream</button>
            </div>
        </div>
        
        <div class="panel right-panel">
            <h2>Sequence Visualizer</h2>
            <div class="controls-container" id="playback-controls">
                <button class="control-btn" onclick="replaySequence()">⏪ Replay</button>
                <button class="control-btn" id="btn-back" onclick="stepBackward()">⏮ Back</button>
                <button class="control-btn" id="play-pause-btn" onclick="togglePlayPause()">⏸ Pause</button>
                <button class="control-btn" id="btn-fwd" onclick="stepForward()">⏭ Forward</button>
            </div>
            
            <div id="log-container">
                <div style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--text-secondary);font-style:italic;font-size:0.875rem;">
                    Standby: Awaiting client operation...
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const html = document.documentElement;

        function toggleTheme() {
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            updateCanvasColors(); 
        }
        
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.setAttribute('data-theme', 'dark');
        }

        const cvs = $('star-canvas'), ctx = cvs.getContext('2d');
        let stars = [], starColor = '';

        const updateCanvasColors = () => starColor = getComputedStyle(document.body).getPropertyValue('--star-color').trim();
        const resizeCanvas = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; updateCanvasColors(); };

        class Star {
            constructor() { this.reset(); this.y = Math.random() * cvs.height; }
            reset() { 
                this.x = Math.random() * cvs.width; 
                this.y = 0; 
                this.size = Math.random() * 2; 
                this.speed = Math.random() * 0.5 + 0.1; 
                this.opacity = Math.random() * 0.5 + 0.3; 
            }
            update() { 
                this.y += this.speed; 
                if (this.y > cvs.height) this.reset(); 
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                let c = starColor.replace(')', `, ${this.opacity})`).replace('rgb', 'rgba');
                if (starColor.includes('rgba')) { 
                    let p = starColor.split(','); 
                    p[3] = ` ${this.opacity})`; 
                    c = p.join(','); 
                }
                ctx.fillStyle = c; ctx.fill();
            }
        }
        
        function initStars() {
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
            for (let i = 0; i < Math.floor((cvs.width * cvs.height) / 4000); i++) stars.push(new Star());
            animateStars();
        }
        
        function animateStars() { 
            ctx.clearRect(0, 0, cvs.width, cvs.height); 
            stars.forEach(s => { s.update(); s.draw(); }); 
            requestAnimationFrame(animateStars); 
        }
        
        updateCanvasColors(); initStars();

        let seq = [], stepIdx = 0, timer = null, playing = false;

        function switchActivity() {
            document.querySelectorAll('.activity-section').forEach(el => el.classList.remove('active'));
            $(`form-${$('activity-selector').value}`).classList.add('active');
        }

        async function triggerAction(type) {
            $('log-container').innerHTML = '';$('playback-controls').style.display = 'none'; 
            clearTimeout(timer);
            
            let payload = {};
            if (type === 'browse') payload = { url: $('url').value };
            if (type === 'mail') payload = { to_email: $('to_email').value, subject: $('subject').value, body:$('body').value };
            if (type === 'stream') payload = { quality: $('quality').value };

            try {
                let res = await fetch(`/api/${type}`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                let data = await res.json();
                startSeq(data.sequence);
            } catch (e) {
                $('log-container').innerHTML = `<div style="color:red;padding:1rem;">Connection error.</div>`;
            }
        }

        function updateBtns() {
            if ($('btn-back'))$('btn-back').disabled = (stepIdx <= 0);
            if ($('btn-fwd'))$('btn-fwd').disabled = (stepIdx >= seq.length);
            if ($('play-pause-btn'))$('play-pause-btn').innerHTML = playing ? '⏸ Pause' : '▶️ Play';
        }

        function startSeq(data) {
            clearTimeout(timer); seq = data; stepIdx = 0; playing = true;
            $('log-container').innerHTML = '';$('playback-controls').style.display = 'flex';
            updateBtns(); playNext();
        }

        function playNext() {
            if (!playing) return;
            if (stepIdx >= seq.length) { playing = false; updateBtns(); return; }
            render(seq[stepIdx], true); stepIdx++; updateBtns();
            timer = setTimeout(playNext, 1200);
        }

        function render(step, anim = false) {
            let div = document.createElement('div');
            div.className = `log-entry log-${step.type} ${anim ? 'animating' : ''}`;
            let msg = step.msg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            div.innerHTML = `<div class="meta"><span>${step.sender} ➔ ${step.receiver}</span><span class="protocol-badge">${step.protocol}</span></div><pre>${msg}</pre>`;
            $('log-container').appendChild(div);
            $('log-container').scrollTop =$('log-container').scrollHeight;
        }

        function togglePlayPause() {
            if (playing) { 
                playing = false; 
                clearTimeout(timer); 
            } else { 
                if (stepIdx >= seq.length) return startSeq(seq); 
                playing = true; 
                playNext(); 
            }
            updateBtns();
        }

        function stepForward() {
            clearTimeout(timer); playing = false;
            if (stepIdx < seq.length) { render(seq[stepIdx], true); stepIdx++; }
            updateBtns();
        }

        function stepBackward() {
            clearTimeout(timer); playing = false;
            if (stepIdx > 0) {
                stepIdx--; $('log-container').innerHTML = '';
                for (let i = 0; i < stepIdx; i++) render(seq[i], false);
            }
            updateBtns();
        }

        function replaySequence() { 
            clearTimeout(timer); 
            startSeq(seq); 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Layer Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Light Theme Variables */
            --bg-body: #f4f5f7;
            --bg-surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --border-light: #e5e7eb;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --log-out: #f0fdf4;
            --log-in: #eff6ff;
            --log-border-out: #22c55e;
            --log-border-in: #3b82f6;
            --star-color: rgba(37, 99, 235, 0.4);
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --log-out: rgba(34, 197, 94, 0.1);
            --log-in: rgba(59, 130, 246, 0.1);
            --log-border-out: #22c55e;
            --log-border-in: #3b82f6;
            --star-color: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Star Background Canvas */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-size: 1.25rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            margin: 0;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--border-light);
        }

        h1 { margin: 0; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; }
        .subtitle { margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--text-secondary); font-weight: 400; }
        
        .main-workspace {
            display: flex; 
            gap: 2rem; 
            padding: 2rem; 
            flex: 1; 
            max-width: 1400px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box;
            height: calc(100vh - 100px); /* Fill remaining space on desktop */
        }

        .panel {
            background: var(--bg-surface); 
            border: 1px solid var(--border-light);
            border-radius: 8px; 
            padding: 2rem; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .left-panel { 
            flex: 1 1 350px; 
            max-width: 450px; 
            height: fit-content;
        }

        .right-panel { 
            flex: 2 1 500px; 
            background: rgba(var(--bg-surface), 0.85); 
            backdrop-filter: blur(4px); 
            overflow: hidden; /* Constrain inner scrolling on desktop */
        }

        h2 { 
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-secondary); border-bottom: 1px solid var(--border-light); 
            padding-bottom: 0.75rem; margin-top: 0; margin-bottom: 1.5rem;
            flex-shrink: 0;
        }
        
        .activity-section { display: none; flex-direction: column; gap: 1rem; margin-top: 1.5rem;}
        .activity-section.active { display: flex; }
        
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
        .input-group { margin-bottom: 0.5rem; }

        select, input, textarea {
            width: 100%; padding: 0.625rem 0.75rem; border: 1px solid var(--border-light);
            border-radius: 6px; font-family: inherit; font-size: 0.875rem; box-sizing: border-box;
            background-color: var(--bg-body); color: var(--text-primary); transition: all 0.2s ease;
        }

        select:focus, input:focus, textarea:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button.action-btn {
            background: var(--accent-primary); color: white; border: none; font-weight: 500;
            font-size: 0.875rem; padding: 0.75rem; border-radius: 6px; cursor: pointer; 
            width: 100%; margin-top: 0.5rem; transition: background-color 0.2s ease;
        }
        button.action-btn:hover { background: var(--accent-hover); }

        #log-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px; /* Offset for scrollbar */
            display: flex;
            flex-direction: column;
        }
        
        .log-entry {
            padding: 1.25rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid var(--border-light);
            opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            flex-shrink: 0;
        }
        .log-out { background: var(--log-out); border-left: 4px solid var(--log-border-out); }
        .log-in { background: var(--log-in); border-left: 4px solid var(--log-border-in); }
        
        .meta { 
            display: flex; align-items: center; justify-content: space-between; font-weight: 600; 
            margin-bottom: 0.75rem; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;
        }
        .protocol-badge {
            background-color: var(--bg-body); padding: 0.25rem 0.5rem; border-radius: 4px;
            border: 1px solid var(--border-light); font-weight: 600; color: var(--text-primary);
        }
        pre { 
            margin: 0; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; 
            font-size: 0.875rem; line-height: 1.6; color: var(--text-primary);
        }
        
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }

        /* Responsive Layout Updates */
        @media (max-width: 900px) {
            body {
                height: auto;
            }
            .main-workspace {
                flex-direction: column;
                height: auto;
                padding: 1rem;
                gap: 1.5rem;
            }
            .left-panel {
                max-width: 100%;
                flex: none;
            }
            .right-panel {
                flex: none;
                height: 500px; /* Fixed height for the log monitor on mobile */
            }
            header {
                padding: 1rem;
            }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <header>
        <h1>Application Layer Dashboard</h1>
        <p class="subtitle">Live Protocol Synchronization Monitor</p>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Toggle Dark/Light Mode">🌓</button>
    </header>
    
    <div class="main-workspace">
        <div class="panel left-panel">
            <h2>Command Center</h2>
            
            <div class="input-group">
                <label for="activity-selector">Select Operation</label>
                <select id="activity-selector" onchange="switchActivity()">
                    <option value="browse">HTTP Web Browsing</option>
                    <option value="mail">SMTP Mail Transfer</option>
                    <option value="stream">HTTP Adaptive Streaming</option>
                </select>
            </div>

            <div id="form-browse" class="activity-section active">
                <div class="input-group">
                    <label for="url">Target URL</label>
                    <input type="text" id="url" value="http://www.youtube.com" placeholder="e.g., http://www.example.com">
                </div>
                <button class="action-btn" onclick="triggerAction('browse')">Execute Request</button>
            </div>

            <div id="form-mail" class="activity-section">
                <div class="input-group">
                    <label for="to_email">Recipient Address</label>
                    <input type="text" id="to_email" value="instructor@university.edu">
                </div>
                <div class="input-group">
                    <label for="subject">Subject Line</label>
                    <input type="text" id="subject" value="Protocol Assignment">
                </div>
                <div class="input-group">
                    <label for="body">Message Payload</label>
                    <textarea id="body" rows="4">Please find my submission attached.</textarea>
                </div>
                <button class="action-btn" onclick="triggerAction('mail')">Transmit Data</button>
            </div>

            <div id="form-stream" class="activity-section">
                <div class="input-group">
                    <label for="quality">Stream Resolution</label>
                    <select id="quality">
                        <option value="1080p">1080p High Definition</option>
                        <option value="720p">720p Standard</option>
                    </select>
                </div>
                <button class="action-btn" onclick="triggerAction('stream')">Initialize Stream</button>
            </div>
        </div>

        <div class="panel right-panel">
            <h2>Sequence Visualizer</h2>
            <div id="log-container">
                <div style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-secondary); font-style: italic; font-size: 0.875rem;">
                    Standby: Awaiting client operation...
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Theme Toggle Logic ---
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', target);
            updateCanvasColors(); 
        }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // --- Core Application Logic ---
        function switchActivity() {
            document.querySelectorAll('.activity-section').forEach(el => el.classList.remove('active'));
            const selected = document.getElementById('activity-selector').value;
            document.getElementById(`form-${selected}`).classList.add('active');
        }

        async function triggerAction(type) {
            const logContainer = document.getElementById('log-container');
            logContainer.innerHTML = ''; 
            
            let payload = {};
            if (type === 'browse') payload = { url: document.getElementById('url').value };
            if (type === 'mail') payload = { 
                to_email: document.getElementById('to_email').value,
                subject: document.getElementById('subject').value,
                body: document.getElementById('body').value
            };
            if (type === 'stream') payload = { quality: document.getElementById('quality').value };

            try {
                const response = await fetch(`/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                animateSequence(data.sequence);
            } catch (error) {
                logContainer.innerHTML = `<div style="color: red; padding: 1rem;">Connection error. Ensure backend is running.</div>`;
            }
        }

        function animateSequence(sequence) {
            const logContainer = document.getElementById('log-container');
            let delay = 0;
            
            sequence.forEach((step) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = `log-entry log-${step.type}`;
                    const directionArrow = step.type === 'out' ? '➔' : '➔';
                    
                    div.innerHTML = `
                        <div class="meta">
                            <span>${step.sender} ${directionArrow} ${step.receiver}</span>
                            <span class="protocol-badge">${step.protocol}</span>
                        </div>
                        <pre>${step.msg}</pre>
                    `;
                    logContainer.appendChild(div);
                    // Ensure the container auto-scrolls to the newest entry
                    logContainer.scrollTop = logContainer.scrollHeight;
                }, delay);
                delay += 1200; 
            });
        }

        // --- Starfield Background Logic ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let starColor = '';

        function updateCanvasColors() {
            const style = getComputedStyle(document.body);
            starColor = style.getPropertyValue('--star-color').trim();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            updateCanvasColors();
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; 
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.size = Math.random() * 2;
                this.speed = (Math.random() * 0.5) + 0.1;
                this.opacity = (Math.random() * 0.5) + 0.3;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = starColor.replace(')', `, ${this.opacity})`).replace('rgb', 'rgba'); 
                
                if (starColor.includes('rgba')) {
                    const parts = starColor.split(',');
                    parts[3] = ` ${this.opacity})`;
                    ctx.fillStyle = parts.join(',');
                }
                
                ctx.fill();
            }
        }

        function initStars() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            const starCount = Math.floor((canvas.width * canvas.height) / 4000); 
            for (let i = 0; i < starCount; i++) stars.push(new Star());
            animateStars();
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }
            requestAnimationFrame(animateStars);
        }

        // Boot
        updateCanvasColors();
        initStars();
    </script>
</body>
</html>

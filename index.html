<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP/IP Protocol Stack Visualizer</title>
    <!-- Three.js for 3D Network Visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-body: #090d16;
            --bg-surface: #111827;
            --bg-card: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            
            --badge-dns: #8b5cf6;
            --badge-tcp: #f59e0b;
            --badge-http: #3b82f6;
            --badge-smtp: #10b981;
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            min-height: 100vh; box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .header-title h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.025em; }
        .header-title p { margin: 0.15rem 0 0; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

        .theme-toggle {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-primary); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s ease; font-size: 1rem;
        }
        .theme-toggle:hover { border-color: var(--accent); }

        .main-workspace {
            display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem;
            padding: 1.5rem 2rem; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%;
            box-sizing: border-box; height: calc(100vh - 73px);
        }

        .panel {
            background-color: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden;
        }

        h2 {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;
            margin: 0 0 1.25rem 0;
        }

        .activity-section { display: none; flex-direction: column; gap: 1rem; }
        .activity-section.active { display: flex; }

        .input-group { display: flex; flex-direction: column; gap: 0.35rem; }
        label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }

        select, input, textarea {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 0.65rem 0.85rem; border-radius: 8px;
            font-family: inherit; font-size: 0.85rem; transition: 0.2s ease; outline: none;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        button.action-btn {
            background-color: var(--accent); color: white; border: none;
            font-weight: 500; font-size: 0.85rem; padding: 0.75rem;
            border-radius: 8px; cursor: pointer; transition: 0.2s ease;
            margin-top: 0.5rem; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }
        button.action-btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }

        .right-panel-grid { display: grid; grid-template-rows: 240px 1fr; gap: 1rem; height: 100%; overflow: hidden; }

        /* 3D Canvas Styling */
        #canvas-container {
            position: relative; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; overflow: hidden; width: 100%; height: 100%;
        }
        #topology-canvas { width: 100%; height: 100%; display: block; }
        .canvas-overlay {
            position: absolute; bottom: 8px; left: 12px; font-size: 0.7rem;
            color: var(--text-secondary); background: rgba(0,0,0,0.4); padding: 3px 8px;
            border-radius: 4px; backdrop-filter: blur(4px); pointer-events: none;
        }

        .controls-container { display: none; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
        .control-btn {
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);
            font-size: 0.75rem; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .control-btn:hover:not(:disabled) { border-color: var(--accent); }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #log-container {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;
            padding-right: 4px;
        }

        .log-entry {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 1rem; border-radius: 8px; opacity: 0; transform: translateY(10px);
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .log-entry.log-out { border-left: 3px solid #10b981; }
        .log-entry.log-in { border-left: 3px solid var(--accent); }

        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.7rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .protocol-badge { padding: 2px 6px; border-radius: 4px; color: white; font-size: 0.65srem; font-weight: 600; }
        .badge-dns { background: var(--badge-dns); }
        .badge-tcp { background: var(--badge-tcp); }
        .badge-http { background: var(--badge-http); }
        .badge-smtp { background: var(--badge-smtp); }

        pre { margin: 0; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; line-height: 1.5; color: var(--text-primary); }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        @media (max-width: 900px) {
            .main-workspace { grid-template-columns: 1fr; height: auto; }
            body { height: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>TCP/IP Protocol Stack Visualizer</h1>
            <p>Live 3D Topology & Packet Flow Monitor</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
    </header>

    <div class="main-workspace">
        <!-- Left Panel: Controls -->
        <div class="panel">
            <h2>Command Center</h2>
            
            <div class="input-group" style="margin-bottom: 1.25rem;">
                <label for="activity-selector">Protocol Sequence</label>
                <select id="activity-selector" onchange="switchActivity()">
                    <option value="browse">HTTP Web Browsing (DNS + TCP + HTTP)</option>
                    <option value="mail">SMTP Mail Transfer (DNS + TCP + SMTP)</option>
                    <option value="stream">HTTP Adaptive Streaming (DNS + TCP + HLS)</option>
                </select>
            </div>

            <div id="form-browse" class="activity-section active">
                <div class="input-group">
                    <label>Target URL</label>
                    <input type="text" id="url" value="http://www.youtube.com">
                </div>
                <button class="action-btn" onclick="triggerAction('browse')">Execute Request</button>
            </div>

            <div id="form-mail" class="activity-section">
                <div class="input-group">
                    <label>Recipient Address</label>
                    <input type="text" id="to_email" value="instructor@university.edu">
                </div>
                <div class="input-group">
                    <label>Subject Line</label>
                    <input type="text" id="subject" value="Protocol Assignment">
                </div>
                <div class="input-group">
                    <label>Message Payload</label>
                    <textarea id="body" rows="3">Please find my submission attached.</textarea>
                </div>
                <button class="action-btn" onclick="triggerAction('mail')">Transmit Data</button>
            </div>

            <div id="form-stream" class="activity-section">
                <div class="input-group">
                    <label>Stream Resolution</label>
                    <select id="quality">
                        <option value="1080p">1080p High Definition</option>
                        <option value="720p">720p Standard</option>
                    </select>
                </div>
                <button class="action-btn" onclick="triggerAction('stream')">Initialize Stream</button>
            </div>
        </div>

        <!-- Right Panel: 3D Visualizer & Logs -->
        <div class="panel">
            <h2>Live Topology & Packet Inspector</h2>
            <div class="right-panel-grid">
                <!-- Three.js 3D Canvas Container -->
                <div id="canvas-container">
                    <canvas id="topology-canvas"></canvas>
                    <div class="canvas-overlay">3D Node Topology (Client, DNS, Server)</div>
                </div>

                <!-- Logs & Controls -->
                <div style="display: flex; flex-direction: column; overflow: hidden;">
                    <div class="controls-container" id="playback-controls">
                        <button class="control-btn" onclick="replaySequence()">⏪ Replay</button>
                        <button class="control-btn" id="btn-back" onclick="stepBackward()">⏮ Back</button>
                        <button class="control-btn" id="play-pause-btn" onclick="togglePlayPause()">⏸ Pause</button>
                        <button class="control-btn" id="btn-fwd" onclick="stepForward()">⏭ Forward</button>
                    </div>

                    <div id="log-container">
                        <div style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-secondary); font-style:italic; font-size:0.85rem; text-align:center;">
                            Awaiting operation: Select activity to trace routing...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        
        function toggleTheme() {
            const isDark = document.documentElement.hasAttribute('data-theme');
            if (isDark) document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', 'light');
        }

        // --- Three.js 3D Topology Setup ---
        let scene, camera, renderer, nodes = {}, activePacket = null, packetProgress = 0;
        let packetStart = new THREE.Vector3(), packetEnd = new THREE.Vector3();

        function init3D() {
            const container = $('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 9);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: $('topology-canvas'), antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Ambient Light
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const pointLight = new THREE.PointLight(0x3b82f6, 2, 50);
            pointLight.position.set(0, 5, 5);
            scene.add(pointLight);

            // Create Network Nodes
            createNode('CLIENT', -3.5, 0, 0, 0x3b82f6, 'Client');
            createNode('DNS', 0, 1.8, 0, 0x8b5cf6, 'DNS Server');
            createNode('SERVER', 3.5, 0, 0, 0x10b981, 'Remote Server');

            // Connect lines
            createLine('CLIENT', 'DNS');
            createLine('CLIENT', 'SERVER');

            // Packet Sphere
            const pGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            activePacket = new THREE.Mesh(pGeo, pMat);
            activePacket.visible = false;
            scene.add(activePacket);

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            animate3D();
        }

        function createNode(id, x, y, z, color, label) {
            const geometry = new THREE.SphereGeometry(0.4, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.5, emissive: color, emissiveIntensity: 0.2 });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            scene.add(sphere);
            nodes[id] = { mesh: sphere, pos: sphere.position, originalColor: color };
        }

        function createLine(id1, id2) {
            const material = new THREE.LineBasicMaterial({ color: 0x374151, transparent: true, opacity: 0.5 });
            const points = [nodes[id1].pos, nodes[id2].pos];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            // Animate packet flight if active
            if (activePacket && activePacket.visible) {
                packetProgress += 0.03;
                if (packetProgress >= 1) {
                    activePacket.visible = false;
                } else {
                    activePacket.position.lerpVectors(packetStart, packetEnd, packetProgress);
                }
            }

            renderer.render(scene, camera);
        }

        function triggerPacketAnimation(senderStr, receiverStr) {
            let sKey = 'CLIENT', rKey = 'SERVER';
            if (senderStr.includes('DNS') || receiverStr.includes('DNS')) {
                sKey = 'CLIENT'; rKey = 'DNS';
            } else {
                sKey = 'CLIENT'; rKey = 'SERVER';
            }

            if (nodes[sKey] && nodes[rKey]) {
                packetStart.copy(nodes[sKey].pos);
                packetEnd.copy(nodes[rKey].pos);
                packetProgress = 0;
                activePacket.visible = true;

                // Pulse node effect
                pulseNode(nodes[sKey]);
                setTimeout(() => pulseNode(nodes[rKey]), 300);
            }
        }

        function pulseNode(nodeObj) {
            nodeObj.mesh.material.emissiveIntensity = 0.8;
            setTimeout(() => nodeObj.mesh.material.emissiveIntensity = 0.2, 300);
        }

        window.addEventListener('DOMContentLoaded', init3D);

        // --- App Sequence Logic ---
        let seq = [], stepIdx = 0, timer = null, playing = false;

        function switchActivity() {
            document.querySelectorAll('.activity-section').forEach(el => el.classList.remove('active'));
            $(`form-${$('activity-selector').value}`).classList.add('active');
        }

        async function triggerAction(type) {
            $('log-container').innerHTML = '';$('playback-controls').style.display = 'none'; 
            clearTimeout(timer);
            
            let payload = {};
            if (type === 'browse') payload = { url: $('url').value };
            if (type === 'mail') payload = { to_email: $('to_email').value, subject: $('subject').value, body:$('body').value };
            if (type === 'stream') payload = { quality: $('quality').value };

            try {
                let res = await fetch(`/api/${type}`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                let data = await res.json();
                startSeq(data.sequence);
            } catch (e) {
                $('log-container').innerHTML = `<div style="color:#ef4444;padding:1rem;font-size:0.85rem;">Connection error with backend.</div>`;
            }
        }

        function updateBtns() {
            if ($('btn-back'))$('btn-back').disabled = (stepIdx <= 0);
            if ($('btn-fwd'))$('btn-fwd').disabled = (stepIdx >= seq.length);
            if ($('play-pause-btn'))$('play-pause-btn').innerHTML = playing ? '⏸ Pause' : '▶️ Play';
        }

        function startSeq(data) {
            clearTimeout(timer); seq = data; stepIdx = 0; playing = true;
            $('log-container').innerHTML = '';$('playback-controls').style.display = 'flex';
            updateBtns(); playNext();
        }

        function playNext() {
            if (!playing) return;
            if (stepIdx >= seq.length) { playing = false; updateBtns(); return; }
            render(seq[stepIdx]); stepIdx++; updateBtns();
            timer = setTimeout(playNext, 1200);
        }

        function render(step) {
            let div = document.createElement('div');
            div.className = `log-entry log-${step.type}`;
            
            let badgeClass = 'badge-http';
            let proto = step.protocol.toUpperCase();
            if (proto.includes('DNS')) badgeClass = 'badge-dns';
            else if (proto.includes('TCP')) badgeClass = 'badge-tcp';
            else if (proto.includes('SMTP')) badgeClass = 'badge-smtp';

            let msg = step.msg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            div.innerHTML = `
                <div class="meta">
                    <span>${step.sender} ➔ ${step.receiver}</span>
                    <span class="protocol-badge ${badgeClass}">${step.protocol}</span>
                </div>
                <pre>${msg}</pre>
            `;
            $('log-container').appendChild(div);
            $('log-container').scrollTop =$('log-container').scrollHeight;

            // Trigger 3D packet animation
            triggerPacketAnimation(step.sender, step.receiver);
        }

        function togglePlayPause() {
            if (playing) { playing = false; clearTimeout(timer); } 
            else { if (stepIdx >= seq.length) return startSeq(seq); playing = true; playNext(); }
            updateBtns();
        }

        function stepForward() {
            clearTimeout(timer); playing = false;
            if (stepIdx < seq.length) { render(seq[stepIdx]); stepIdx++; }
            updateBtns();
        }

        function stepBackward() {
            clearTimeout(timer); playing = false;
            if (stepIdx > 0) {
                stepIdx--; $('log-container').innerHTML = '';
                for (let i = 0; i < stepIdx; i++) render(seq[i]);
            }
            updateBtns();
        }

        function replaySequence() { clearTimeout(timer); startSeq(seq); }
    </script>
</body>
</html>
